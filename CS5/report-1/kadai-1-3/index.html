  <h1 id="kadai-1-3">課題1-3</h1>
  <div style="width: 500px;">
    関数 \( f \in L^2(0, \pi) \)に対するFourierサイン級数展開は,
    \[
      f(x) \sim \sum_{n=1}^\infty b_n \sin (nx),\quad b_n = \frac{1}{\pi} \int_0^\pi f(x) \sin (nx) dx
    \]
    で与えられる.

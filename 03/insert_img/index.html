<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"> 
  <title>画像の挿入</title>
</head>
<body>
  <h1>画像の挿入</h1>
  
  <h2>表示するだけ</h2>
    <img src="./img/halloween.jpg">
  <h2>alt属性あり</h2>
    <img src="./img/halloween.jpg" alt="ハロウィンのかぼちゃ">
  <h2>サイズの指定あり</h2>
    <img src="./img/halloween.jpg" width="672" height="448">

    <a href="../03/">トップへ戻る</a>
  </p>
</body>
</html>
